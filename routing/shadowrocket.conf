NETFLIX = select, PROXY, SG_AUTO, HK_AUTO, US_AUTO, TW_AUTO, SG, HK, TW, US
HMT = select, {{PROXIES}}, DIRECT
TELEGRAM = select, PROXY, AUTO, US_AUTO, SG_AUTO, HK_AUTO, TW_AUTO, HK, JP, SG, US, TW
MEDIA = select, PROXY, AUTO
MICROSOFT = select, PROXY, DIRECT, AUTO, US_AUTO, SG_AUTO, HK_AUTO, TW_AUTO, HK, JP, SG, US, TW
APPLE = select, DIRECT, PROXY, AUTO, US_AUTO, SG_AUTO, HK_AUTO, TW_AUTO, HK, JP, SG, US, TW
