# Shadowrocket routing template
# Replace {{PROXIES}} with the node list generated for Shadowrocket.

[General]
# Add your general Shadowrocket settings here.

[Proxy]
{{PROXIES}}

[Proxy Group]
PROXY = select, {{PROXIES}}, DIRECT
AUTO = url-test, {{PROXIES}}, url = http://www.gstatic.com/generate_204, interval = 300, tolerance = 50
HK = select, {{PROXIES}}, DIRECT
JP = select, {{PROXIES}}, DIRECT
SG = select, {{PROXIES}}, DIRECT
US = select, {{PROXIES}}, DIRECT
TW = select, {{PROXIES}}, DIRECT
HK_AUTO = url-test, {{PROXIES}}, url = http://www.gstatic.com/generate_204, interval = 300, tolerance = 50
JP_AUTO = url-test, {{PROXIES}}, url = http://www.gstatic.com/generate_204, interval = 300, tolerance = 50
SG_AUTO = url-test, {{PROXIES}}, url = http://www.gstatic.com/generate_204, interval = 300, tolerance = 50
US_AUTO = url-test, {{PROXIES}}, url = http://www.gstatic.com/generate_204, interval = 300, tolerance = 50
TW_AUTO = url-test, {{PROXIES}}, url = http://www.gstatic.com/generate_204, interval = 300, tolerance = 50
BINANCE = select, PROXY, US_AUTO, JP_AUTO, SG_AUTO, TW_AUTO, HK, JP, SG, US, TW, DIRECT
BYBIT = select, PROXY, US_AUTO, JP_AUTO, SG_AUTO, TW_AUTO, HK, JP, SG, US, TW, DIRECT
