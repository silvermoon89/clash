rules:
  # --- 第一优先级：自定义规则 ---
  - RULE-SET,MyDirect,DIRECT
  - RULE-SET,MyProxy,🚀 节点选择

  # --- 第二优先级：基础直连 ---
  - RULE-SET,LocalAreaNetwork,DIRECT
  - RULE-SET,UnBan,DIRECT
  - RULE-SET,GoogleCN,DIRECT
  - RULE-SET,SteamCN,DIRECT
  - RULE-SET,Download,DIRECT
  - RULE-SET,Bilibili,DIRECT

  # --- 第三优先级：广告与净化 ---
  - RULE-SET,BanAD,🛑 广告拦截
  - RULE-SET,BanProgramAD,🛑 广告拦截
  - RULE-SET,AntiAD,🛑 广告拦截

  # --- 第四优先级：微软、谷歌、苹果 ---
  - RULE-SET,Bing,Ⓜ️ 微软服务
  - RULE-SET,OneDrive,Ⓜ️ 微软服务
  - RULE-SET,Microsoft,Ⓜ️ 微软服务
  - RULE-SET,GoogleFCM,📢 谷歌FCM
  - RULE-SET,Apple,🍎 苹果服务

  # --- 第五优先级：特定应用 ---
  - RULE-SET,Binance,🚀 Binance
  - RULE-SET,Bybit,🚀 Bybit
  - RULE-SET,Oracle,🚀 Oracle
  - RULE-SET,Telegram,📲 电报消息
  - RULE-SET,OpenAi,💬 OpenAi
  - RULE-SET,NetEaseMusic,DIRECT
  - RULE-SET,Steam,🎮 游戏平台

  # --- 第六优先级：视频媒体 ---
  - RULE-SET,YouTube,📹 油管视频
  - RULE-SET,Netflix,🎥 奈飞视频
  - RULE-SET,Bahamut,📺 港澳台解锁
  - RULE-SET,BilibiliHMT,📺 港澳台解锁

  # --- 第七优先级：通用媒体与兜底 ---
  - RULE-SET,ChinaMedia,🌏 国内媒体
  - RULE-SET,ProxyMedia,🌍 国外媒体
  - RULE-SET,ProxyGFWlist,🚀 节点选择
  - RULE-SET,ChinaDomain,DIRECT
  - RULE-SET,ChinaCompanyIp,DIRECT,no-resolve
  - RULE-SET,ChinaIp,DIRECT,no-resolve
  - MATCH,🐟 漏网之鱼
