# Clash/Mihomo routing template
# Use this file as a remote routing source for 3x-ui subClashRules:
#   Settings -> Subscription -> Clash / Mihomo -> Enable Routing
#   subClashRules: https://your-domain.example/routing/mihomo.yaml
#
# This file mirrors the routing rules in config.yaml.
# Groups are adapted for 3x-ui dynamic proxies with include-all + filter.
#
# 3x-ui generates the real proxies from the selected client inbounds.
# Therefore this file intentionally contains no proxy-providers and no "use".
# The groups use include-all + filter so they work with dynamically generated nodes.
#
# Remote routing source only merges:
#   proxy-groups, rule-providers, rules
#
# DNS/fake-ip settings are not part of this template. Keep those in the
# OpenClash profile, or use inline subClashRules if you need to inject DNS.

proxy-groups:
  # --- 总入口 ---
  - name: 🚀 节点选择
    type: select
    include-all: true
    proxies:
      - 自建节点
      - 自建自动
      - DIRECT

  - name: 自建节点
    type: select
    include-all: true
    filter: '(?i)(自建|vps)'

  - name: 自建自动
    type: url-test
    include-all: true
    filter: '(?i)(自建|vps)'
    tolerance: 50
    interval: 300

  # --- 自动测速与地区分组 ---
  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    filter: '(?i)(香港|港|(?:^|[^A-Za-z])HK(?:[^A-Za-z]|$)|Hong)'

  - name: 🇯🇵 日本节点
    type: select
    include-all: true
    filter: '(?i)(日本|日|(?:^|[^A-Za-z])JP(?:[^A-Za-z]|$)|Japan)'

  - name: 🇸🇬 狮城节点
    type: select
    include-all: true
    filter: '(?i)(新加坡|坡|狮城|(?:^|[^A-Za-z])SG(?:[^A-Za-z]|$)|Singapore)'

  - name: US 美国节点
    type: select
    include-all: true
    filter: '(?i)(美国|美|(?:^|[^A-Za-z])US(?:[^A-Za-z]|$)|United States|America)'

  - name: TW 台湾节点
    type: select
    include-all: true
    filter: '(?i)(台湾|台|(?:^|[^A-Za-z])TW(?:[^A-Za-z]|$)|Taiwan)'

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    exclude-filter: '(?i)(直连|落地|自建|VPS|vps)'
    tolerance: 50
    interval: 300

  - name: ♻️ 香港自动
    type: url-test
    include-all: true
    filter: '(?i)(香港|港|(?:^|[^A-Za-z])HK(?:[^A-Za-z]|$)|Hong)'
    exclude-filter: '(?i)(直连|落地|自建|VPS|vps)'
    tolerance: 50
    interval: 300

  - name: ♻️ 日本自动
    type: url-test
    include-all: true
    filter: '(?i)(日本|日|(?:^|[^A-Za-z])JP(?:[^A-Za-z]|$)|Japan)'
    exclude-filter: '(?i)(直连|落地|自建|VPS|vps)'
    tolerance: 50
    interval: 300

  - name: ♻️ 狮城自动
    type: url-test
    include-all: true
    filter: '(?i)(新加坡|坡|狮城|(?:^|[^A-Za-z])SG(?:[^A-Za-z]|$)|Singapore)'
    exclude-filter: '(?i)(直连|落地|自建|VPS|vps)'
    tolerance: 50
    interval: 300

  - name: ♻️ 美国自动
    type: url-test
    include-all: true
    filter: '(?i)(美国|美|(?:^|[^A-Za-z])US(?:[^A-Za-z]|$)|United States|America)'
    exclude-filter: '(?i)(直连|落地|自建|VPS|vps)'
    tolerance: 50
    interval: 300

  - name: ♻️ 台湾自动
    type: url-test
    include-all: true
    filter: '(?i)(台湾|台|(?:^|[^A-Za-z])TW(?:[^A-Za-z]|$)|Taiwan)'
    exclude-filter: '(?i)(直连|落地|自建|VPS|vps)'
    tolerance: 50
    interval: 300

  # --- 业务分组 ---
  - name: 🚀 Binance
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 美国自动
      - ♻️ 日本自动
      - ♻️ 狮城自动
      - ♻️ 台湾自动
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - US 美国节点
      - TW 台湾节点

  - name: 🚀 Bybit
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 美国自动
      - ♻️ 日本自动
      - ♻️ 狮城自动
      - ♻️ 台湾自动
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - US 美国节点
      - TW 台湾节点

  - name: 🚀 Oracle
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 美国自动
      - ♻️ 日本自动
      - ♻️ 狮城自动
      - ♻️ 台湾自动
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - US 美国节点
      - TW 台湾节点

  - name: 💬 OpenAi
    type: select
    filter: '(?i)美国|US|States|新加坡|SG|Singapore|日本|JP|Japan|台|TW|Taiwan'
    proxies:
      - 🚀 节点选择
      - ♻️ 美国自动
      - ♻️ 日本自动
      - ♻️ 狮城自动
      - ♻️ 台湾自动
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - US 美国节点
      - TW 台湾节点

  - name: 📹 油管视频
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 香港自动
      - ♻️ 日本自动
      - ♻️ 狮城自动
      - ♻️ 美国自动
      - ♻️ 台湾自动
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - US 美国节点
      - TW 台湾节点

  - name: 🎥 奈飞视频
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 狮城自动
      - ♻️ 香港自动
      - ♻️ 美国自动
      - ♻️ 台湾自动
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - TW 台湾节点
      - US 美国节点

  - name: 📺 港澳台解锁
    type: select
    include-all: true
    filter: '(?i)(香港|港|(?:^|[^A-Za-z])HK(?:[^A-Za-z]|$)|Hong|台湾|台|(?:^|[^A-Za-z])TW(?:[^A-Za-z]|$)|Taiwan)'
    proxies:
      - DIRECT

  # --- 普通分组 ---
  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - ♻️ 美国自动
      - ♻️ 狮城自动
      - ♻️ 香港自动
      - ♻️ 台湾自动
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - US 美国节点
      - TW 台湾节点

  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择

  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT
      - ♻️ 自动选择
      - ♻️ 美国自动
      - ♻️ 狮城自动
      - ♻️ 香港自动
      - ♻️ 台湾自动
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - US 美国节点
      - TW 台湾节点

  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
      - ♻️ 美国自动
      - ♻️ 狮城自动
      - ♻️ 香港自动
      - ♻️ 台湾自动
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - US 美国节点
      - TW 台湾节点

  - name: 📢 谷歌FCM
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🎮 游戏平台
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
      - ♻️ 美国自动
      - ♻️ 狮城自动
      - ♻️ 香港自动
      - ♻️ 台湾自动
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - US 美国节点
      - TW 台湾节点

  - name: 🌏 国内媒体
