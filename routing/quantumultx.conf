# Quantumult X routing template
# Replace {{PROXIES}} with the node list generated for Quantumult X.
# Validate the remote filter URLs before production use.

[policy]
static=PROXY, {{PROXIES}}, direct
url-latency-benchmark=AUTO, {{PROXIES}}, check-interval=300, tolerance=50
static=HK, {{PROXIES}}, direct
static=JP, {{PROXIES}}, direct
static=SG, {{PROXIES}}, direct
static=US, {{PROXIES}}, direct
static=TW, {{PROXIES}}, direct
static=BINANCE, PROXY, AUTO, US, JP, SG, TW, HK, direct
static=BYBIT, PROXY, AUTO, US, JP, SG, TW, HK, direct
static=ORACLE, PROXY, AUTO, US, JP, SG, TW, HK, direct
static=OPENAI, PROXY, AUTO, US, JP, SG, TW, HK
static=YOUTUBE, PROXY, AUTO, US, JP, SG, TW, HK
static=NETFLIX, PROXY, AUTO, US, JP, SG, TW, HK
static=HMT, {{PROXIES}}, direct
static=TELEGRAM, PROXY, AUTO, US, JP, SG, TW, HK
static=MEDIA, PROXY, AUTO
static=MICROSOFT, PROXY, direct, AUTO, US, JP, SG, TW, HK
static=APPLE, direct, PROXY, AUTO, US, JP, SG, TW, HK
static=FCM, PROXY, direct
static=GAME, direct, PROXY, AUTO, US, JP, SG, TW, HK
static=CN_MEDIA, direct, PROXY
static=AD_BLOCK, reject, direct

[filter_remote]
